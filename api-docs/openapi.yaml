openapi: 3.0.0
info:
  title: URL Shortener API
  version: 1.0.0
  description: A simple and efficient URL shortening service API
  contact:
    name: URL Shortener Team
    url: https://github.com/drementer/url-shortener

servers:
  - url: http://localhost:3001
    description: Local development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Status
    description: Health check endpoints
  - name: Auth
    description: Account and session endpoints
  - name: URLs
    description: URL management endpoints
  - name: Roles
    description: Role and quota management endpoints (Admin only)
  - name: Redirect
    description: URL redirection endpoint

security:
  - bearerAuth: []

paths:
  /api/status:
    get:
      summary: Health Check
      description: Verify that the API server is running and healthy
      tags: [Status]
      security: []
      responses:
        '200':
          description: Server is healthy and operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /api/auth/register:
    post:
      summary: Register
      description: Create an account and start a session for it
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: Account created and session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  summary: Missing or malformed email
                  value:
                    error: A valid email is required
                missingPassword:
                  summary: No password sent
                  value:
                    error: A password is required
                shortPassword:
                  summary: Password too short
                  value:
                    error: Password must be at least 8 characters
        '409':
          description: The email already belongs to an account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: This email is already registered
        '429':
          description: More than 10 attempts within 15 minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Too many attempts, please try again later

  /api/auth/login:
    post:
      summary: Log In
      description: Exchange email and password for a new session
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: >-
            The email or the password is wrong. The same message covers both, so
            the response cannot be used to find out which emails are registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid email or password
        '429':
          description: More than 10 attempts within 15 minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Too many attempts, please try again later

  /api/auth/refresh:
    post:
      summary: Refresh Session
      description: >-
        Exchange a refresh token for a new token pair. The token sent in is
        retired by the exchange, so each one works exactly once. Replaying a
        retired token is treated as a leak and ends every session of that user.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: A new token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Refresh token missing from the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Refresh token is required
        '401':
          description: The refresh token is unknown, already used or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid refresh token
        '429':
          description: More than 10 attempts within 15 minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Too many attempts, please try again later

  /api/auth/logout:
    post:
      summary: Log Out
      description: >-
        End the session behind the given refresh token. An unknown token is
        answered the same way, since the caller is logged out either way.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '400':
          description: Refresh token missing from the request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Refresh token is required
        '429':
          description: More than 150 requests within a minute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Too many requests, please try again later

  /api/auth/me:
    get:
      summary: Get Current User
      description: The account the access token belongs to
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The signed in account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/urls:
    get:
      summary: Get All URLs
      description: Retrieve the shortened URLs belonging to the signed in user
      tags: [URLs]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Successfully retrieved the URLs of the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Url'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Internal server error

    post:
      summary: Create Short URL
      description: Create a new shortened URL owned by the signed in user
      tags: [URLs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUrlRequest'
      responses:
        '201':
          description: URL shortened successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Url'
        '400':
          description: Request body failed validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUrl:
                  summary: Missing or malformed URL
                  value:
                    error: A valid URL is required
                shortSlug:
                  summary: Custom slug too short
                  value:
                    error: Custom slug must be at least 3 characters
                reservedSlug:
                  summary: Custom slug is reserved
                  value:
                    error: This custom slug is reserved
                invalidExpiry:
                  summary: expiresIn is not a number
                  value:
                    error: expiresIn must be a number of hours
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Active link quota reached for the user's role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Active link quota exceeded (maximum 10 active links allowed for role EDITOR)
        '409':
          description: The requested custom slug is already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: This custom slug is already in use
        '429':
          description: More than 10 URLs created within a minute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: URL creation limit reached, try again later

  /api/urls/{code}:
    get:
      summary: Get URL Statistics
      description: >-
        Retrieve statistics and click events for one of your own shortened URLs.
        A code owned by someone else answers 404, exactly like an unknown one,
        so the endpoint cannot be used to find out which codes are taken.
      tags: [URLs]
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
          description: The short code of the URL
          example: abc123
      responses:
        '200':
          description: URL statistics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The URL does not exist or belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: URL not found
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Internal server error

    delete:
      summary: Delete URL
      description: >-
        Delete one of your own shortened URLs by its short code. A code owned by
        someone else answers 404, exactly like an unknown one.
      tags: [URLs]
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
          description: The short code of the URL to delete
          example: abc123
      responses:
        '200':
          description: URL deleted successfully
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: URL deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The URL does not exist or belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: URL not found
        '429':
          description: More than 10 delete requests within a minute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Delete limit reached, try again later
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
  /api/roles:
    get:
      summary: List All Roles
      description: Retrieve all defined user roles and their link quotas. Requires ADMIN role.
      tags: [Roles]
      responses:
        '200':
          description: Successfully retrieved all roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create Role
      description: Define a new role with custom active link quota. Requires ADMIN role.
      tags: [Roles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Name must be at least 2 characters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A role with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Role with name 'VIP' already exists

  /api/roles/{id}:
    get:
      summary: Get Role by ID
      description: Retrieve details of a specific role by its ID. Requires ADMIN role.
      tags: [Roles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The role ID
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Role not found

    patch:
      summary: Update Role
      description: Update the name, description, or maxActiveLinks quota of an existing role. Requires ADMIN role.
      tags: [Roles]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The role ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Role not found
        '409':
          description: Role name conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/roles/users/{userId}:
    patch:
      summary: Assign Role to User
      description: Promote or change a user's assigned role and active link quota. Requires ADMIN role.
      tags: [Roles]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
          description: The user ID to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '200':
          description: User role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User or Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  summary: User not found
                  value:
                    error: User not found
                roleNotFound:
                  summary: Role not found
                  value:
                    error: Role not found

  /{code}:
    get:
      summary: Redirect to Original URL
      description: >-
        Redirect from short URL to the original URL. A click is recorded only
        when the link is still live. Unknown and expired codes are redirected to
        the client application instead of answering with an error.
      tags: [Redirect]
      security: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
          description: The short code of the URL
          example: abc123
      responses:
        '302':
          description: >-
            Always a redirect, never an error body. A live link redirects to its
            original URL, an expired one to CLIENT_URL/expired/{code} and an
            unknown code to CLIENT_URL/404, so the client application renders
            those two cases itself.
          headers:
            Location:
              schema:
                type: string
              description: >-
                The original URL, CLIENT_URL/expired/{code} or CLIENT_URL/404
                depending on the state of the code
              example: https://example.com/very/long/url

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        The access token from a register, login or refresh response, sent as
        `Authorization: Bearer <accessToken>`. It expires after 15 minutes by
        default, after which the refresh token buys a new one.

  responses:
    Unauthorized:
      description: The access token is missing, malformed or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              summary: No token sent
              value:
                error: Authentication required
            invalid:
              summary: Token does not verify
              value:
                error: Invalid or expired token

    Forbidden:
      description: The caller lacks permissions or quota to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficientPermissions:
              summary: Insufficient permissions
              value:
                error: Insufficient permissions
            quotaExceeded:
              summary: Active link quota exceeded
              value:
                error: Active link quota exceeded (maximum 10 active links allowed for role EDITOR)

  schemas:
    Url:
      type: object
      required: [id, shortCode, originalUrl, clicks, expiresAt, createdAt]
      properties:
        id:
          type: string
          description: Unique URL identifier (CUID)
          example: clxyz123abc456def
        shortCode:
          type: string
          description: Generated short code for the URL
          example: abc123
        originalUrl:
          type: string
          format: uri
          description: The original long URL
          example: https://example.com/very/long/url/path
        clicks:
          type: integer
          description: Total click count, derived from the recorded click events
          example: 42
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: URL expiration timestamp (optional)
          example: '2025-12-31T23:59:59Z'
        createdAt:
          type: string
          format: date-time
          description: URL creation timestamp
          example: '2025-01-01T10:30:00Z'

    UrlStats:
      type: object
      required: [id, shortCode, originalUrl, clicks, expiresAt, createdAt, clickEvents]
      properties:
        id:
          type: string
          description: Unique URL identifier (CUID)
          example: clxyz123abc456def
        shortCode:
          type: string
          description: Generated short code for the URL
          example: abc123
        originalUrl:
          type: string
          format: uri
          description: The original long URL
          example: https://example.com/very/long/url/path
        clicks:
          type: integer
          description: Total click count, derived from the recorded click events
          example: 42
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: URL expiration timestamp (optional)
          example: '2025-12-31T23:59:59Z'
        createdAt:
          type: string
          format: date-time
          description: URL creation timestamp
          example: '2025-01-01T10:30:00Z'
        clickEvents:
          type: array
          description: List of click events for this URL
          items:
            $ref: '#/components/schemas/Click'

    Click:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          description: Unique click event identifier (CUID)
          example: clxyz789ghi012jkl
        userAgent:
          type: string
          nullable: true
          description: User agent string of the visitor
          example: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)
        referer:
          type: string
          nullable: true
          description: Referer URL
          example: https://google.com
        createdAt:
          type: string
          format: date-time
          description: Click timestamp
          example: '2025-01-10T09:15:30Z'

    CreateUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The original URL to shorten
          example: https://example.com/very/long/url/path
        customSlug:
          type: string
          description: >-
            Preferred short code. Letters, numbers, hyphen and underscore only.
            An empty string is treated as not provided. The values api, 404,
            expired and stats are reserved.
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_-]+$'
          example: my-custom-link
        expiresIn:
          type: integer
          description: Number of whole hours until the URL expires (optional)
          minimum: 1
          maximum: 8760
          example: 24

    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Stored lowercased, so casing never creates a second account
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: correct horse battery staple

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: The refresh token from the last session response
          example: 3f0c1d1e9a7b4c2d8e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b

    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          description: Unique user identifier (CUID)
          example: clxyz123abc456def
        email:
          type: string
          format: email
          example: user@example.com
        role:
          $ref: '#/components/schemas/RoleSummary'
          nullable: true
          description: Assigned role and link quota
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
          example: '2025-01-01T10:30:00Z'

    SessionResponse:
      type: object
      required: [user, accessToken, refreshToken, expiresIn]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: Sent as a Bearer token on every authenticated request
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJjbHh5ejEyMyJ9
        refreshToken:
          type: string
          description: Exchanged for a new pair once the access token expires
          example: 3f0c1d1e9a7b4c2d8e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b
        expiresIn:
          type: integer
          description: Lifetime of the access token in seconds
          example: 900

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error message
          example: URL not found

    HealthCheckResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
          description: Server health status
          example: ok
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp
          example: '2025-01-01T12:00:00Z'

    Role:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: Unique role identifier (CUID)
          example: clxyzrole123abc
        name:
          type: string
          description: Unique role name
          example: EDITOR
        description:
          type: string
          nullable: true
          description: Description of the role and tier
          example: Editor user with expanded link quota
        maxActiveLinks:
          type: integer
          nullable: true
          description: Maximum number of concurrently active links (null represents unlimited)
          example: 10
        createdAt:
          type: string
          format: date-time
          description: Role creation timestamp
          example: '2026-09-06T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Role update timestamp
          example: '2026-09-06T12:00:00Z'

    RoleSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          description: Unique role identifier (CUID)
          example: clxyzrole123abc
        name:
          type: string
          description: Role name
          example: EDITOR
        description:
          type: string
          nullable: true
          description: Description of the role
          example: Editor user with expanded link quota
        maxActiveLinks:
          type: integer
          nullable: true
          description: Maximum active links quota (null represents unlimited)
          example: 10

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 30
          description: Role name (stored normalized in uppercase)
          example: VIP
        description:
          type: string
          nullable: true
          maxLength: 255
          description: Role description
          example: VIP tier with expanded quota
        maxActiveLinks:
          type: integer
          nullable: true
          minimum: 0
          description: Active link quota (null for unlimited)
          example: 50

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 30
          description: Updated role name
          example: VIP_PRO
        description:
          type: string
          nullable: true
          maxLength: 255
          description: Updated role description
          example: Updated VIP tier description
        maxActiveLinks:
          type: integer
          nullable: true
          minimum: 0
          description: Updated active links quota
          example: 100

    AssignRoleRequest:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
          nullable: true
          description: ID of the role to assign to the user (null to unassign role)
          example: clxyzrole123abc
